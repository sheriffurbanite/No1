/* ===== EXTRACTED FROM FIRST FILE: Splash / UFC loading ===== */
.splash{
  position:fixed;inset:0;z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#07080c;transition:opacity .35s ease
}
.splash.hidden{display:none!important}
.splash.fade-out{opacity:0;pointer-events:none}
.spribe-load{display:flex;flex-direction:column;align-items:center;gap:22px}
.splash-brand{
  font-family:Georgia,serif;font-style:italic;font-weight:800;
  font-size:42px;color:#ed0a45;letter-spacing:.5px
}
.spribe-dots{
  position:relative;width:56px;height:56px;
  animation:spribe-spin 1.1s linear infinite
}
.spribe-dots i{
  position:absolute;top:50%;left:50%;
  width:9px;height:9px;margin:-4.5px;border-radius:50%;
  background:#e10600;box-shadow:0 0 8px rgba(225,6,0,.55)
}
.spribe-dots i:nth-child(1){transform:rotate(0deg) translateY(-22px);opacity:1}
.spribe-dots i:nth-child(2){transform:rotate(45deg) translateY(-22px);opacity:.9}
.spribe-dots i:nth-child(3){transform:rotate(90deg) translateY(-22px);opacity:.8}
.spribe-dots i:nth-child(4){transform:rotate(135deg) translateY(-22px);opacity:.7}
.spribe-dots i:nth-child(5){transform:rotate(180deg) translateY(-22px);opacity:.6}
.spribe-dots i:nth-child(6){transform:rotate(225deg) translateY(-22px);opacity:.5}
.spribe-dots i:nth-child(7){transform:rotate(270deg) translateY(-22px);opacity:.4}
.spribe-dots i:nth-child(8){transform:rotate(315deg) translateY(-22px);opacity:.3}
@keyframes spribe-spin{to{transform:rotate(360deg)}}
.splash-connection-block{margin-top:28px;text-align:center}
.splash-site-title{font-weight:800;font-size:13px;letter-spacing:2px;color:#e5e7eb;margin-bottom:6px}
.splash-connection{font-size:12px;color:#9ca3af;font-weight:600}

/* ===== EXTRACTED FROM FIRST FILE: Win bubble ===== */

<audio id="lossSound" preload="auto" playsinline webkit-playsinline

<script>
/* ========== SOUND SYSTEM (exact logic from first file) ========== */
const bgMusic = document.getElementById('bgMusic');
const lossSound = document.getElementById('lossSound');
const speakerBtn = document.getElementById('speakerBtn');
let musicOn = true;
let inGameAudio = false;
let lossResumeTimer = null;

var SC_MUSIC_URL = 'https://res.cloudinary.com/qegjv5mo/video/upload/f_mp3/Aviator_-_Music_1080p.mp3';
var scAudioCtx = null, scGain = null, scBuffer = null, scSource = null, scMusicOn = true;

function hideAudioEl(el){
  if(!el) return;
  el.controls = false;
  el.removeAttribute('controls');
  el.setAttribute('controlslist','nodownload nofullscreen noremoteplayback');
  el.setAttribute('disablepictureinpicture','');
  el.style.cssText = 'display:none!important;visibility:hidden!important;opacity:0;width:0;height:0;position:fixed;left:-9999px;top:-9999px;pointer-events:none;z-index:-1';
}
function lockAudioToGameOnly(){
  hideAudioEl(bgMusic); hideAudioEl(lossSound);
  try{
    if(navigator.mediaSession){
      navigator.mediaSession.metadata = new MediaMetadata({title:' ',artist:' ',album:' '});
      ['play','pause','seekbackward','seekforward','previoustrack','nexttrack','stop'].forEach(a=>{
        try{navigator.mediaSession.setActionHandler(a,()=>{});}catch(e){}
      });
    }
  }catch(e){}
}
function clearMediaSession(){
  try{
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata = null;
      navigator.mediaSession.playbackState = "none";
      ["play","pause","seekbackward","seekforward","previoustrack","nexttrack","stop"].forEach(a=>{
        try{navigator.mediaSession.setActionHandler(a,null);}catch(e){}
      });
    }
  }catch(e){}
}
setInterval(clearMediaSession,3000);

function scInitAudio(){
  try{
    if(!scAudioCtx){
      scAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
      scGain = scAudioCtx.createGain();
      scGain.gain.value = 0.45;
      scGain.connect(scAudioCtx.destination);
    }
    clearMediaSession();
  }catch(e){}
}
function scLoadMusic(){
  if(!SC_MUSIC_URL || scBuffer) return;
  scInitAudio();
  fetch(SC_MUSIC_URL)
    .then(r=>r.arrayBuffer())
    .then(d=>scAudioCtx.decodeAudioData(d))
    .then(b=>{scBuffer=b;})
    .catch(()=>{});
}
function scPlayMusic(){
  try{
    scInitAudio();
    if(!scMusicOn) return;
    if(scSource){ try{scAudioCtx.resume();}catch(e0){} return; }
    if(!scBuffer){
      scLoadMusic();
      setTimeout(function(){ if(scBuffer && !scSource && scMusicOn) scPlayMusic(); },400);
      return;
    }
    scAudioCtx.resume();
    scSource = scAudioCtx.createBufferSource();
    scSource.buffer = scBuffer;
    scSource.loop = true;
    scSource.connect(scGain);
    scSource.onended = function(){ scSource = null; };
    scSource.start(0);
    clearMediaSession();
  }catch(e){}
}
function scStopMusic(){
  try{ if(scSource){ try{scSource.stop();}catch(e1){} scSource=null; } }catch(e){}
}

function tryPlayMusic(){
  try{ scPlayMusic(); if(scSource||scBuffer) return; }catch(e){}
  if(!bgMusic || !musicOn || !inGameAudio) return;
  try{ if(lossSound){ lossSound.pause(); lossSound.currentTime=0; } }catch(e){}
  lockAudioToGameOnly();
  bgMusic.volume = 0.45;
  const p = bgMusic.play(); try{clearMediaSession();}catch(e){}
  if(p && typeof p.catch==='function') p.catch(()=>{});
  setTimeout(lockAudioToGameOnly,100);
}

/* Restart main music automatically after every round (as requested) */
function restartMusicForRound(){
  try{
    if(typeof scPlayMusic==='function' && (scBuffer||scSource)){
      scMusicOn = true;
      scPlayMusic();
      if(lossSound){ try{lossSound.pause(); lossSound.currentTime=0;}catch(e){} }
      return;
    }
  }catch(e){}
  if(!bgMusic || !musicOn || !inGameAudio) return;
  lockAudioToGameOnly();
  try{
    if(lossSound){ lossSound.pause(); lossSound.currentTime=0; }
    if(bgMusic.paused){
      const p = bgMusic.play(); try{clearMediaSession();}catch(e){}
    }else{
      try{clearMediaSession();}catch(e){}
      return;
    }
  }catch(e){}
  setTimeout(lockAudioToGameOnly,100);
}

function playLossSound(){
  if(!inGameAudio || !musicOn) return;
  lockAudioToGameOnly();
  if(lossResumeTimer){ clearTimeout(lossResumeTimer); lossResumeTimer=null; }
  const resumeBgm = ()=>{
    if(!inGameAudio || !musicOn) return;
    try{
      if(lossSound){ lossSound.onended=null; if(!lossSound.paused){lossSound.pause();lossSound.currentTime=0;} }
    }catch(e){}
    tryPlayMusic();
  };
  try{
    if(bgMusic) bgMusic.pause();
    if(lossSound){
      lossSound.onended = resumeBgm;
      lossSound.currentTime = 0;
      lossSound.volume = 0.7;
      const p = lossSound.play();
      if(p && typeof p.catch==='function') p.catch(()=>{ lossResumeTimer=setTimeout(resumeBgm,300); });
      lossResumeTimer = setTimeout(resumeBgm,2000);
    }else{
      lossResumeTimer = setTimeout(resumeBgm,300);
    }
  }catch(e){
    lossResumeTimer = setTimeout(resumeBgm,300);
  }
  setTimeout(lockAudioToGameOnly,100);
}

function updateSpeakerUI(){
  if(!speakerBtn) return;
  if(musicOn){
    speakerBtn.textContent = '🔊';
    speakerBtn.classList.remove('muted');
    speakerBtn.title = 'Mute music';
  }else{
    speakerBtn.textContent = '🔇';
    speakerBtn.classList.add('muted');
    speakerBtn.title = 'Unmute music';
  }
}
if(speakerBtn){
  speakerBtn.addEventListener('click', e=>{
    e.stopPropagation();
    musicOn = !musicOn;
    scMusicOn = musicOn;
    if(musicOn && inGameAudio){
      tryPlayMusic();
    }else{
      try{ if(bgMusic) bgMusic.pause(); if(lossSound) lossSound.pause(); scStopMusic(); }catch(err){}
      lockAudioToGameOnly();
    }
    updateSpeakerUI();
  });
}
function unlockMusic(){
  if(inGameAudio) tryPlayMusic();
  document.removeEventListener('click',unlockMusic);
  document.removeEventListener('touchstart',unlockMusic);
}
document.addEventListener('click',unlockMusic);
document.addEventListener('touchstart',unlockMusic);
lockAudioToGameOnly();
updateSpeakerUI();

/* ========== GAME STATE (simplified but functional) ========== */
let balance = 2500.00;
let stake = 100;
let phase = 'waiting'; // waiting | countdown | running | crash
let mult = 1.00;
let crashPoint = 2.5;
let startTs = 0;
let countdownLeft = 5;
let myBet = null; // {stake, cashed:false, cashMult:null}

const balEl = document.getElementById('bal');
const stakeVal = document.getElementById('stakeVal');

function fmt(n){ return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function updateBal(){ balEl.textContent = fmt(balance); }
function updateStakeUI(){ stakeVal.textContent = stake; betAmt.textContent = stake; }

/* Chat messages (exact style + content pool from first file) */
const MSGS = [
  "Wueh, hii game leo imenipeleka mbio proper. Unadhani umeiva, alafu ndege inakataa kubeba mzigo 😂",
  "Nimeona multiplier ikipanda nikasema leo ni yangu, kumbe nilikuwa najiconvince tu. Hii mambo ni noma.",
  "Aki nilikuwa nangoja ipande kidogo tu, ghafla ndege imeenda. Sasa nimebaki kuangalia screen kama mjinga.",
  "Leo nimepata ka-win kidogo, lakini losses zingine bado zinanichezea akili. Hii game inataka discipline maze.",
  "Msee, unakaa hapo ukisema next round itakuwa poa, alafu inakushangaza tena. Lazima mtu ajue wakati wa kuacha.",
  "Hii ndege haina huruma bana. Inapanda polepole ukianza kuamini, inakata safari ghafla.",
  "Nilikuwa nimejipanga vizuri leo, lakini mambo yamechange haraka kuliko nilivyokuwa nimeexpect. Wueh!",
  "Kuna round niliona ikipanda nikashangaa, nikasema kumbe leo kuna kitu. Lakini si kila round unaweza kushinda.",
  "Aki hii game ni patience na bahati, lakini usijipe pressure ya kurudisha pesa ulizopoteza. Unaweza kujipata pabaya.",
  "Nimecheka lakini ndani najua nimeumia 😂 Hii round imenifunza kwamba si kila opportunity ni ya kushika.",
  "Msee, ile feeling ya kuona ndege imeenda kabla hujatoa pesa ni noma. Unabaki tu kusema, kwani nilikuwa nasubiri nini?",
  "Leo nimeamua hakuna kufuata losses. Kama mambo haiko sawa, ni sawa kuclose game na kuendelea na shughuli zingine.",
  "Niliona multiplier imeanza kupanda nikapata ka-hope, lakini ikaishia mapema. Hii ndio maana siwezi kuhesabu win kabla haijatokea.",
  "Wasee, msichukulie kila round kama lazima mlipize ya previous. Pesa ikienda, imeenda; kujilazimisha kurudisha kunaweza kuongeza shida.",
  "Hii Aviator inaweza kukupa furaha na frustration ndani ya dakika mbili. Mimi leo nachukua lesson, si lazima niendelee kucheza."
];
const AVATARS = ['😀','😎','🔥','💎','🚀','👑','🎯','💰','⚡','🌟','🍀','🎲'];
function rand(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[rand(0,arr.length-1)]; }

function addChatMsg(forceWin){
  const cm = document.getElementById('cm');
  if(!cm) return;
  const isWin = forceWin === true || (forceWin !== false && Math.random() < 0.18);
  const id = '2***' + rand(1,9);
  const av = pick(AVATARS);
  const time = new Date().toTimeString().slice(0,8);
  let html = '';
  if(isWin){
    const multN = (Math.random()<0.5 ? 1.5+Math.random()*4 : 6+Math.random()*20).toFixed(2);
    const bet = rand(100,8000);
    const win = Math.round(bet * parseFloat(multN));
    html = `<div class="msg"><div class="av2">${av}</div>
      <div class="bb wcb">
        <div class="wh"><span>\( {id}</span><small> \){time}</small></div>
        <div class="wi">
          <div class="wp"><div class="av2">\( {av}</div><b> \){id}</b></div>
          <div class="wg">
            <div><small>Cashed out</small><b class="pu">${multN}x</b></div>
            <div><small>Win</small><b class="gr">${fmt(win)} KES</b></div>
            <div><small>Round</small><b>${multN}x</b></div>
            <div><small>Bet</small><b>${fmt(bet)} KES</b></div>
          </div>
          <div class="wd"><s></s><s></s></div>
        </div>
      </div>
      <div class="hr"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.5s-9-6-9-12.2A5 5 0 0 1 12 6.5a5 5 0 0 1 9 2.8c0 6.2-9 12.2-9 12.2z"/></svg><small>${rand(0,7)}</small></div>
    </div>`;
  }else{
    html = `<div class="msg"><div class="av2">${av}</div>
      <div class="bb"><div class="mh2"><span>\( {id}</span><small> \){time}</small></div>${pick(MSGS)}</div>
      <div class="hr"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 21.5s-9-6-9-12.2A5 5 0 0 1 12 6.5a5 5 0 0 1 9 2.8c0 6.2-9 12.2-9 12.2z"/></svg><small>${rand(0,5)}</small></div>
    </div>`;
  }
  cm.insertAdjacentHTML('beforeend', html);
  while(cm.children.length > 30) cm.removeChild(cm.firstChild);

/* Simple game loop */
function nextCrash(){
  // Realistic distribution
  const r = Math.random();
  if(r < 0.4) return 1.01 + Math.random()*0.9;
  if(r < 0.75) return 1.5 + Math.random()*3;
  if(r < 0.92) return 4 + Math.random()*8;
  return 10 + Math.random()*40;
}

function startWaiting(){
  phase = 'waiting';
  mult = 1.00;
  partnerBrand.style.display = 'flex';
  partnerBrand.querySelector('.partner-subtitle').textContent = 'WAITING FOR NEXT ROUND';
  cdLine.style.width = '100%';
  restartMusicForRound(); // <-- auto restart music every round
  setTimeout(startCountdown, 2200 + Math.random()*1800);
}

function startCountdown(){
  phase = 'countdown';
  countdownLeft = 5;
  partnerBrand.querySelector('.partner-subtitle').textContent = 'STARTING IN ' + countdownLeft;
  const tick = ()=>{
    if(phase !== 'countdown') return;
    countdownLeft -= 0.05;
    cdLine.style.width = Math.max(0,(countdownLeft/5)*100) + '%';
    if(countdownLeft <= 0){
      startFlying();
      return;
    }
    partnerBrand.querySelector('.partner-subtitle').textContent = 'STARTING IN ' + Math.ceil(countdownLeft);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function startFlying(){
  phase = 'running';
  partnerBrand.style.display = 'none';
  crashPoint = nextCrash();
  startTs = performance.now();
  mult = 1.00;
  if(myBet){ myBet.cashed = false; myBet.cashMult = null; }
  // enable cashout if bet placed
  if(myBet){
    betBtn.className = 'go co';
    betBtn.innerHTML = '<span>CASHOUT</span><small id="liveWin">'+fmt(stake)+' KES</small>';
  }
}

function doCrash(){
  phase = 'crash';
  partnerBrand.style.display = 'flex';
  partnerBrand.querySelector('.partner-subtitle').textContent = 'FLEW AWAY!';
  playLossSound(); // loss SFX then music resumes
  if(myBet && !myBet.cashed){
    // lost
    myBet = null;
    betBtn.className = 'go';
    betBtn.innerHTML = '<span>BET</span><small><i id="betAmt">'+stake+'</i> KES</small>';
  }
  setTimeout(startWaiting, 2800);
}

function cashOut(){
  if(phase !== 'running' || !myBet || myBet.cashed) return;
  myBet.cashed = true;
  myBet.cashMult = mult;
  const win = stake * mult;
  balance += win;
  updateBal();
  // show win bubble (exact style)
  wbMult.textContent = mult.toFixed(2) + 'x';
  wbAmt.textContent = fmt(win) + ' KES';
  winBubble.classList.add('show');
  setTimeout(()=>winBubble.classList.remove('show'), 3200);
  betBtn.className = 'go';
  betBtn.innerHTML = '<span>BET</span><small><i id="betAmt">'+stake+'</i> KES</small>';
  myBet = null;
  addChatMsg(true); // push a win card into chat
}

function placeBet(){
  if(phase === 'running' || phase === 'crash') return;
  if(balance < stake){
    const t = document.getElementById('toast');
    t.textContent = 'Not enough balance';
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'),2200);
    return;
  }
  balance -= stake;
  updateBal();
  myBet = {stake, cashed:false, cashMult:null};
  betBtn.className = 'go cn';
  betBtn.innerHTML = '<span>CANCEL</span><small>Waiting…</small>';
}

/* Canvas draw (simple plane path) */
function draw(){
  const w = canvas.width, h = canvas.height;
  ctx.fillStyle = '#0a0a0b';
  ctx.fillRect(0,0,w,h);

  // grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)';
  ctx.lineWidth = 1;
  for(let x=0;x<w;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
  for(let y=0;y<h;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }

  if(phase === 'running' || phase === 'crash'){
    const t = (performance.now() - startTs) / 1000;
    // simple growth curve
    mult = Math.min(crashPoint, 1 + Math.pow(t * 0.45, 1.55));
    if(mult >= crashPoint && phase === 'running'){
      mult = crashPoint;
      doCrash();
    }

    // path
    const progress = Math.min(1, (mult-1)/(crashPoint-1+0.001));
    const px = 40 + progress * (w-80);
    const py = h - 60 - Math.log(mult) * 90;

    ctx.strokeStyle = phase==='crash' ? '#e2002e' : '#28a809';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(40, h-60);
    for(let i=0;i<=progress*60;i++){
      const m = 1 + (mult-1)*(i/(progress*60||1));
      const x = 40 + (i/(progress*60||1)) * (w-80) * progress;
      const y = h - 60 - Math.log(m) * 90;
      ctx.lineTo(x,y);
    }
    ctx.stroke();

    // plane
    ctx.fillStyle = phase==='crash' ? '#e2002e' : '#fff';
    ctx.beginPath();
    ctx.arc(px, py, 8, 0, Math.PI*2);
    ctx.fill();

    // live mult text
    ctx.fillStyle = phase==='crash' ? '#e2002e' : '#fff';
    ctx.font = 'bold 64px Inter, Arial';
    ctx.textAlign = 'center';
    ctx.fillText(mult.toFixed(2) + 'x', w/2, h/2 - 20);

    if(myBet && !myBet.cashed && phase==='running'){
      const liveWin = stake * mult;
      const el = document.getElementById('liveWin');
      if(el) el.textContent = fmt(liveWin) + ' KES';
    }
  }else if(phase === 'waiting' || phase === 'countdown'){
    // already handled by partner branding overlay
  }

  requestAnimationFrame(draw);
}

/* Controls */
document.getElementById('minus').onclick = ()=>{ stake = Math.max(10, stake-10); updateStakeUI(); };
document.getElementById('plus').onclick = ()=>{ stake = Math.min(50000, stake+10); updateStakeUI(); };
document.querySelectorAll('.q button').forEach(b=>{
  b.onclick = ()=>{ stake = Number(b.dataset.v); updateStakeUI(); };
});
betBtn.onclick = ()=>{
  if(phase === 'running' && myBet && !myBet.cashed){
    cashOut();
  }else if(myBet && (phase==='waiting'||phase==='countdown')){
    // cancel
    balance += myBet.stake;
    updateBal();
    myBet = null;
    betBtn.className = 'go';
    betBtn.innerHTML = '<span>BET</span><small><i id="betAmt">'+stake+'</i> KES</small>';
  }else{
    placeBet();
  }
};

/* Chat toggle */
document.getElementById('cb').onclick = ()=> document.getElementById('chat').classList.add('show');
document.getElementById('cc2').onclick = ()=> document.getElementById('chat').classList.remove('show');
document.getElementById('cs').onclick = ()=>{
  const t = document.getElementById('ci').value.trim();
  if(!t) return;
  document.getElementById('ci').value = '';
  // push own message
  const cm = document.getElementById('cm');
  const html = `<div class="msg"><div class="av2">YOU</div>
    <div class="bb"><div class="mh2"><span>You</span><small>\( {new Date().toTimeString().slice(0,8)}</small></div> \){t}</div></div>`;
  cm.insertAdjacentHTML('beforeend', html);
  cm.scrollTop = cm.scrollHeight;
};

/* Init */
updateBal();
updateStakeUI();

// Splash → start game
setTimeout(()=>{
  const s = document.getElementById('splash');
  s.classList.add('fade-out');
  setTimeout(()=>{
    s.classList.add('hidden');
    inGameAudio = true;
    scLoadMusic();
    scPlayMusic();
    tryPlayMusic();
    startWaiting();
    // seed chat
    for(let i=0;i<12;i++) addChatMsg(i%5===0);
    setInterval(()=>addChatMsg(), 3200);
  }, 400);
}, 2200);

// scale to fit
function fit(){
  const app = document.getElementById('app');
  const scale = Math.min(window.innerWidth/720, window.innerHeight/1400, 1);
  app.style.transform = `scale(${scale})`;
}
fit();
window.addEventListener('resize', fit);

// start draw loop
requestAnimationFrame(draw);
</script>
