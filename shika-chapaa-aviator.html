    else if(t.closest('.go'))betClick(Array.prototype.indexOf.call($('cards').children,t.closest('.card')));
    else if(t.classList.contains('cx')){var ar=t.parentNode;ar.classList.remove('cc');ar.querySelector('.k2').classList.remove('on')}
    else if(t.classList.contains('tg')){t.classList.toggle('on');if(t.classList.contains('k2'))t.parentNode.classList.toggle('cc',t.classList.contains('on'))}
    else if(t.parentNode.classList.contains('mode')){[].forEach.call(t.parentNode.children,function(x){x.classList.toggle('on',x===t)});t.closest('.card').classList.toggle('auto',t.textContent==='Auto')}
  };
  $('cards').addEventListener('focusout',function(e){if(e.target.classList.contains('amti'))setAmt(cidx(e.target),e.target.value.replace(/,/g,''))});
  $('cards').addEventListener('keydown',function(e){if(e.target.classList.contains('amti')&&e.key==='Enter')e.target.blur()});
  function clamp(v){return Math.max(0,Math.min(1,v))}
  
  /* ===== Plane + stage (complete; attachment was truncated on images) ===== */
  var cv=$('cv'),cx=cv.getContext('2d'),W=704,H=551,DPR=1;
  function size(){
    DPR=Math.min(3,(window.devicePixelRatio||1)*(parseFloat(($('app')||{}).style&&$('app').style.zoom)||1));
    cv.width=W*DPR;cv.height=H*DPR;
  }
  size();window.addEventListener('resize',function(){try{fit();}catch(e){}size();});

  function drawPlane(t,sp){
    var R='#e8073c',D='#6b0a20';
    cx.save();cx.scale(.25,.25);cx.translate(-110,-306);
    cx.fillStyle=R;
    cx.beginPath();cx.moveTo(60,212);cx.quadraticCurveTo(82,188,128,192);cx.quadraticCurveTo(162,206,152,238);cx.lineTo(168,274);cx.lineTo(118,262);cx.quadraticCurveTo(92,250,90,226);cx.quadraticCurveTo(72,226,60,212);cx.fill();
    cx.beginPath();cx.moveTo(196,157);cx.lineTo(252,146);cx.lineTo(452,228);cx.lineTo(408,244);cx.lineTo(270,268);cx.lineTo(172,276);cx.lineTo(248,240);cx.lineTo(214,202);cx.fill();
    cx.beginPath();cx.moveTo(168,274);cx.lineTo(420,238);cx.lineTo(586,194);cx.lineTo(590,152);cx.lineTo(500,146);cx.lineTo(436,130);cx.lineTo(346,160);cx.lineTo(396,180);cx.lineTo(310,214);cx.fill();
    cx.beginPath();cx.moveTo(88,306);cx.lineTo(126,293);cx.lineTo(480,256);cx.lineTo(600,236);cx.lineTo(594,213);cx.lineTo(455,238);cx.lineTo(104,282);cx.fill();
    cx.strokeStyle=D;cx.lineWidth=7;cx.lineCap='round';
    cx.beginPath();cx.moveTo(228,182);cx.lineTo(250,190);cx.moveTo(232,204);cx.lineTo(254,212);cx.moveTo(406,150);cx.lineTo(428,160);cx.stroke();
    cx.lineWidth=10;cx.beginPath();cx.moveTo(488,178);cx.lineTo(530,222);cx.moveTo(530,176);cx.lineTo(486,224);cx.stroke();
    cx.translate(606,185);cx.rotate(.09);
    var sx=Math.abs(Math.cos(t*sp));
    cx.fillStyle='rgba(232,7,60,.16)';cx.beginPath();cx.ellipse(0,0,30,138,0,0,7);cx.fill();
    cx.fillStyle=R;cx.beginPath();cx.ellipse(0,0,Math.max(4,17*sx),136,0,0,7);cx.fill();
    cx.beginPath();cx.moveTo(-16,-18);cx.lineTo(30,0);cx.lineTo(-16,18);cx.fill();
    cx.strokeStyle=D;cx.lineWidth=5;cx.beginPath();cx.moveTo(-8,-10);cx.lineTo(18,0);cx.lineTo(-8,10);cx.stroke();
    cx.restore();
  }

  function draw(t){
    var m=S.phase==='wait'?1:S.m,ph=S.phase;
    cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#0a0a0b';cx.fillRect(0,0,W,H);
    // rotating strips
    cx.save();cx.translate(0,H);cx.rotate(t*0.00006);
    var n=22,step=Math.PI*1.5/n;
    for(var i=0;i<n;i++){if(i%2)continue;cx.fillStyle='rgba(255,255,255,.055)';cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,1400,-i*step-0.2,-(i+1)*step-0.2,true);cx.fill()}
    cx.restore();
    var hue=205+Math.min(115,70*clamp((m-1.3)/2.2)+45*clamp((m-3.5)/6));
    var g=cx.createRadialGradient(352,290,0,352,290,300);
    g.addColorStop(0,'hsla('+hue+',85%,48%,.62)');g.addColorStop(.55,'hsla('+hue+',80%,30%,.25)');g.addColorStop(1,'hsla('+hue+',80%,20%,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);

    // PRE-ROUND animation
    if(ph==='wait'){
      var p=clamp((Date.now()-S.wt)/5000);
      cx.fillStyle='#fff';cx.font='600 24px Roboto,Arial,sans-serif';cx.textAlign='center';
      cx.fillText('WAITING FOR NEXT ROUND',W/2,268);
      // spinner arc
      cx.save();cx.translate(W/2,320);cx.rotate(t*0.008);
      cx.strokeStyle='#e8083e';cx.lineWidth=4;cx.beginPath();cx.arc(0,0,18,-Math.PI/2,Math.PI);cx.stroke();
      cx.restore();
      cx.fillStyle='#1c1d20';cx.fillRect(W/2-110,360,220,8);
      cx.fillStyle='#e8083e';cx.fillRect(W/2-110,360,220*(1-p),8);
      cx.fillStyle='#8c8e92';cx.font='500 16px Roboto,Arial,sans-serif';
      cx.fillText(Math.max(0,Math.ceil(5-(Date.now()-S.wt)/1000))+'s',W/2,390);
      cx.save();cx.translate(W/2-70,440);drawPlane(t,.03);cx.restore();
      return;
    }

    var f=1-Math.exp(-(m-1)*2.2),px=30+470*f,py=H-26-370*(1-Math.exp(-(m-1)*4.5));
    var fly=0;if(ph==='crash')fly=clamp((Date.now()-S.ct)/1000);
    var bob=ph==='fly'?Math.sin(t/380)*5*f:0;py+=bob;
    var ox=px+fly*fly*900,oy=py-fly*220;
    cx.beginPath();cx.moveTo(4,H-4);cx.quadraticCurveTo(px*.58,H-4,px,py+6);
    cx.lineTo(px,H);cx.lineTo(4,H);cx.closePath();
    var fg=cx.createLinearGradient(0,py,0,H);fg.addColorStop(0,'rgba(229,8,60,.5)');fg.addColorStop(1,'rgba(110,0,14,.9)');
    cx.fillStyle=fg;cx.fill();
    cx.beginPath();cx.moveTo(4,H-4);cx.quadraticCurveTo(px*.58,H-4,px,py+6);
    cx.strokeStyle='#e8083e';cx.lineWidth=6;cx.lineCap='round';cx.stroke();
    cx.save();cx.translate(ox,oy+6);cx.globalAlpha=1-fly*.6;drawPlane(t,ph==='fly'?.05:.02);cx.restore();
    cx.textAlign='center';cx.fillStyle='#fff';cx.shadowColor='rgba(0,0,0,.35)';cx.shadowBlur=18;
    cx.font='700 118px Roboto,Arial,sans-serif';cx.fillText(m.toFixed(2)+'x',W/2,332);cx.shadowBlur=0;
    if(ph==='crash'){cx.fillStyle='#e8083e';cx.font='700 34px Roboto,Arial,sans-serif';cx.fillText('FLEW AWAY!',W/2,218)}
  }
  function loop(t){draw(t);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);

  /* ===== Balance sync with parent home (no payments) ===== */
  var LS_USER='shikachapaa_user', LS_ACC='shikachapaa_accounts';
  var currentUser=null;
  function loadSession(){
    try{
      var s=JSON.parse(localStorage.getItem(LS_USER)||'null');
      var a=JSON.parse(localStorage.getItem(LS_ACC)||'{}');
      if(s&&s.phone&&a[s.phone]!=null){
        currentUser={phone:s.phone,balance:Number((a[s.phone].balance!=null?a[s.phone].balance:a[s.phone])||0)};
        return true;
      }
    }catch(e){}
    return false;
  }
  function saveBalance(){
    if(!currentUser)return;
    try{
      var a=JSON.parse(localStorage.getItem(LS_ACC)||'{}');
      if(typeof a[currentUser.phone]!=='object'||a[currentUser.phone]===null)a[currentUser.phone]={};
      a[currentUser.phone].balance=Number(currentUser.balance)||0;
      localStorage.setItem(LS_ACC,JSON.stringify(a));
      var s=JSON.parse(localStorage.getItem(LS_USER)||'{}');
      s.phone=currentUser.phone;s.balance=currentUser.balance;
      localStorage.setItem(LS_USER,JSON.stringify(s));
    }catch(e){}
  }
  function updateBalUI(){
    var el=$('bal')||document.querySelector('.bal .a b')||document.querySelector('.bal b');
    if(el&&currentUser) el.textContent=fmt(currentUser.balance);
  }
  // poll parent balance every 2s (iframe stay in sync if home deposits)
  setInterval(function(){
    if(!currentUser)return;
    try{
      var a=JSON.parse(localStorage.getItem(LS_ACC)||'{}');
      var b=a[currentUser.phone];
      var nb=Number((b&&b.balance!=null?b.balance:b)||0);
      if(nb!==currentUser.balance){currentUser.balance=nb;updateBalUI();}
    }catch(e){}
  },2000);

  // Hook toast/bet insufficient to real balance when go/bet clicked
  // If setAmt/balance checks exist, patch bal display only

  function goHome(){
    try{
      if(window.parent&&window.parent!==window)window.parent.postMessage('shika-close-aviator','*');
      else window.location.href='shika-chapaa-home.html#/home';
    }catch(e){try{history.back();}catch(e2){}}
  }
  var gh=$('gateHome'),gb=$('gateBack');
  if(gh)gh.onclick=goHome;if(gb)gb.onclick=goHome;
  var nb=document.querySelector('.nav span');
  if(nb){nb.style.cursor='pointer';nb.addEventListener('click',goHome);}

  function hideSplash(){
    var sp=$('scSplash');
    if(!sp)return;
    sp.classList.add('fade');
    setTimeout(function(){sp.classList.add('hidden');},400);
  }

  function boot(){
    var tx=$('scSplashTxt');
    if(tx)tx.textContent='Connecting…';
    setTimeout(function(){if(tx)tx.textContent='Loading game…';},600);
    setTimeout(function(){
      if(!loadSession()){
        hideSplash();
        var g=$('loginGate');if(g)g.classList.remove('hidden');
        return;
      }
      updateBalUI();
      hideSplash();
      try{
        if(window.AviatorSound){
          if(AviatorSound.unlock)AviatorSound.unlock();
          if(AviatorSound.setMusicOn)AviatorSound.setMusicOn(true);
        }
      }catch(e){}
    },1600);
  }

  // Mult colour on win cards
  if(typeof wcard==='function'){
    var _wc=wcard;
    wcard=function(n,e,x,w,b,r){
      var h=_wc(n,e,x,w,b,r);
      var m=Number(x)||0;
      var col=m<2?'#00b8d1':m<10?'#9a35cf':'#d826c0';
      return h.replace(/class="pu"/g,'style="color:'+col+'"').replace(/class='pu'/g,'style="color:'+col+'"');
    };
  }

  // Real bet: deduct/credit when user presses Bet if balance hooks exist
  // Intercept insufficient balance using currentUser
  var _toast=typeof toast==='function'?toast:null;
  window.__scCharge=function(amt){
    if(!currentUser)return false;
    if(currentUser.balance<amt)return false;
    currentUser.balance=Math.round((currentUser.balance-amt)*100)/100;
    saveBalance();updateBalUI();return true;
  };
  window.__scCredit=function(amt){
    if(!currentUser)return;
    currentUser.balance=Math.round((currentUser.balance+amt)*100)/100;
    saveBalance();updateBalUI();
  };

  // Wire GO buttons to charge balance if game exposes setAmt
  document.addEventListener('click',function(e){
    var go=e.target.closest('.go');
    if(!go)return;
    if(!currentUser){goHome();return;}
    var amt=Number(S&&S.amt)||10;
    if(currentUser.balance<amt){
      e.stopPropagation();
      if(_toast)_toast('Not enough balance');
      return;
    }
    // allow original handler; we deduct when bet accepted if S tracks active bets
  },true);

  // Start core loops already scheduled in logic; ensure boot after
  try{if(typeof buildCards==='function')buildCards();}catch(e){}
  try{if(typeof hist==='function')hist();}catch(e){}
  try{if(typeof newRound==='function')newRound();}catch(e){}
  try{if(typeof tick==='function'){tick();setInterval(tick,100);}}catch(e){}
  boot();
})();
</script>
