  $('cb').onclick=function(){$('menu').classList.remove('show');chatShow(!$('chat').classList.contains('show'))};

  $('cm').onclick=function(e){var h=e.target.closest('.hr');if(!h)return;var on=h.classList.toggle('on'),n=(+h.dataset.l||0)+(on?1:0);h.querySelector('small').textContent=n||''};
  function cnt(){var n=160-$('ci').value.length;$('cn').innerHTML='<u>AA</u>'+n;$('cs').setAttribute('fill',$('ci').value.trim()?'#cfcfcf':'#6a6a6a')}

  $('ci').oninput=cnt;$('cs').onclick=send;$('ci').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};

  var tt;function toast(m,ok){var t=$('toast');t.firstChild.nodeValue=m||'Not enough balance';t.classList.toggle('ok',!!ok);t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},3000)}
  $('tx').onclick=function(){$('toast').classList.remove('show')};

  };
  function clamp(v){return Math.max(0,Math.min(1,v))}
  
  /* ===== Canvas / plane / loop ===== */
  var cv=$('cv'),cx=cv.getContext('2d'),W=704,H=551,DPR=1;
  function size(){
    DPR=Math.min(3,(window.devicePixelRatio||1)*(parseFloat($('app').style.zoom)||1));
    cv.width=W*DPR;cv.height=H*DPR;
  }
  size();window.addEventListener('resize',function(){fit();size();});

  function drawPlaneSprite(t,sp){
    var R='#e8073c',D='#6b0a20';
    cx.save();cx.scale(.25,.25);cx.translate(-110,-306);
    cx.fillStyle=R;
    cx.beginPath();cx.moveTo(60,212);cx.quadraticCurveTo(82,188,128,192);cx.quadraticCurveTo(162,206,152,238);cx.lineTo(168,274);cx.lineTo(118,262);cx.quadraticCurveTo(92,250,90,226);cx.quadraticCurveTo(72,226,60,212);cx.fill();
    cx.beginPath();cx.moveTo(196,157);cx.lineTo(252,146);cx.lineTo(452,228);cx.lineTo(408,244);cx.lineTo(270,268);cx.lineTo(172,276);cx.lineTo(248,240);cx.lineTo(214,202);cx.fill();
    cx.beginPath();cx.moveTo(168,274);cx.lineTo(420,238);cx.lineTo(586,194);cx.lineTo(590,152);cx.lineTo(500,146);cx.lineTo(436,130);cx.lineTo(346,160);cx.lineTo(396,180);cx.lineTo(310,214);cx.fill();
    cx.beginPath();cx.moveTo(88,306);cx.lineTo(126,293);cx.lineTo(480,256);cx.lineTo(600,236);cx.lineTo(594,213);cx.lineTo(455,238);cx.lineTo(104,282);cx.fill();
    cx.strokeStyle=D;cx.lineWidth=7;cx.lineCap='round';
    cx.beginPath();cx.moveTo(228,182);cx.lineTo(250,190);cx.moveTo(232,204);cx.lineTo(254,212);cx.moveTo(406,150);cx.lineTo(428,160);cx.stroke();
    cx.lineWidth=10;cx.beginPath();cx.moveTo(488,178);cx.lineTo(530,222);cx.moveTo(530,176);cx.lineTo(486,224);cx.stroke();
    cx.translate(606,185);cx.rotate(.09);
    var sx=Math.abs(Math.cos(t*sp));
    cx.fillStyle='rgba(232,7,60,.16)';cx.beginPath();cx.ellipse(0,0,30,138,0,0,7);cx.fill();
    cx.fillStyle=R;cx.beginPath();cx.ellipse(0,0,Math.max(4,17*sx),136,0,0,7);cx.fill();
    cx.beginPath();cx.moveTo(-16,-18);cx.lineTo(30,0);cx.lineTo(-16,18);cx.fill();
    cx.strokeStyle=D;cx.lineWidth=5;cx.beginPath();cx.moveTo(-8,-10);cx.lineTo(18,0);cx.lineTo(-8,10);cx.stroke();
    cx.restore();
  }

  function draw(t){
    var m=S.phase==='wait'?1:S.m,ph=S.phase;
    cx.setTransform(DPR,0,0,DPR,0,0);cx.fillStyle='#0a0a0b';cx.fillRect(0,0,W,H);
    cx.save();cx.translate(0,H);cx.rotate(t*0.00006);
    var n=22,step=Math.PI*1.5/n;
    for(var i=0;i<n;i++){if(i%2)continue;cx.fillStyle='rgba(255,255,255,.055)';cx.beginPath();cx.moveTo(0,0);cx.arc(0,0,1400,-i*step-0.2,-(i+1)*step-0.2,true);cx.fill()}
    cx.restore();
    var hue=205+Math.min(115,70*clamp((m-1.3)/2.2)+45*clamp((m-3.5)/6));
    var g=cx.createRadialGradient(352,290,0,352,290,300);
    g.addColorStop(0,'hsla('+hue+',85%,48%,.62)');g.addColorStop(.55,'hsla('+hue+',80%,30%,.25)');g.addColorStop(1,'hsla('+hue+',80%,20%,0)');
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    if(ph==='wait'){
      var p=clamp((Date.now()-S.wt)/5000);
      cx.fillStyle='#fff';cx.font='600 24px Roboto,Arial,sans-serif';cx.textAlign='center';
      cx.fillText('WAITING FOR NEXT ROUND',W/2,268);
      cx.fillStyle='#1c1d20';cx.fillRect(W/2-110,292,220,8);
      cx.fillStyle='#e8083e';cx.fillRect(W/2-110,292,220*(1-p),8);
      cx.save();cx.translate(W/2-70,380);drawPlaneSprite(t,.03);cx.restore();return;
    }
    var f=1-Math.exp(-(m-1)*2.2),px=30+470*f,py=H-26-370*(1-Math.exp(-(m-1)*4.5));
    var fly=0;if(ph==='crash')fly=clamp((Date.now()-S.ct)/1000);
    var bob=(ph==='fly'&&window.__scAnimOn!==false)?Math.sin(t/380)*5*f:0;py+=bob;
    var ox=px+fly*fly*900,oy=py-fly*220;
    cx.beginPath();cx.moveTo(4,H-4);cx.quadraticCurveTo(px*.58,H-4,px,py+6);
    cx.lineTo(px,H);cx.lineTo(4,H);cx.closePath();
    var fg=cx.createLinearGradient(0,py,0,H);fg.addColorStop(0,'rgba(229,8,60,.5)');fg.addColorStop(1,'rgba(110,0,14,.9)');
    cx.fillStyle=fg;cx.fill();
    cx.beginPath();cx.moveTo(4,H-4);cx.quadraticCurveTo(px*.58,H-4,px,py+6);
    cx.strokeStyle='#e8083e';cx.lineWidth=6;cx.lineCap='round';cx.stroke();
    cx.save();cx.translate(ox,oy+6);cx.globalAlpha=1-fly*.6;drawPlaneSprite(t,ph==='fly'?.05:.02);cx.restore();
    cx.textAlign='center';cx.fillStyle='#fff';cx.shadowColor='rgba(0,0,0,.35)';cx.shadowBlur=18;
    cx.font='700 118px Roboto,Arial,sans-serif';cx.fillText(m.toFixed(2)+'x',W/2,332);cx.shadowBlur=0;
    if(ph==='crash'){cx.fillStyle='#e8083e';cx.font='700 34px Roboto,Arial,sans-serif';cx.fillText('FLEW AWAY!',W/2,218)}
  }
  function loop(t){draw(t);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);

  /* ===== Session ===== */
  var LS_USER='shikachapaa_user',LS_ACC='shikachapaa_accounts',currentUser=null;
  function loadSession(){
    try{
      var s=JSON.parse(localStorage.getItem(LS_USER)||'null');
      var a=JSON.parse(localStorage.getItem(LS_ACC)||'{}');
      if(s&&s.phone&&a[s.phone]){currentUser={phone:s.phone,balance:Number(a[s.phone].balance||0)};return true;}
    }catch(e){}
    return false;
  }
  function saveBalance(){
    if(!currentUser)return;
    try{
      var a=JSON.parse(localStorage.getItem(LS_ACC)||'{}');
      if(!a[currentUser.phone])a[currentUser.phone]={balance:0};
      a[currentUser.phone].balance=currentUser.balance;
      localStorage.setItem(LS_ACC,JSON.stringify(a));
      var s=JSON.parse(localStorage.getItem(LS_USER)||'{}');
      s.balance=currentUser.balance;s.phone=currentUser.phone;
      localStorage.setItem(LS_USER,JSON.stringify(s));

    var el=document.querySelector('.bal .a b');

  }

  /* ===== Signals: socket + offline ===== */
  var SIGNAL_HOST='https://no-gen.bonto.run',socket=null,lowStreak=0;
  function offlineHash(str){var h=2166136261>>>0;str=String(str);for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function offlineSeededRandom(seed){var t=seed>>>0;return function(){t+=0x6D2B79F5;var r=Math.imul(t^(t>>>15),1|t);r^=r+Math.imul(r^(r>>>7),61|r);return ((r^(r>>>14))>>>0)/4294967296;};}
  function genCrashPoint(){
    var rnd=offlineSeededRandom(offlineHash('shika-offline-'+Math.floor(Date.now()/12000)));
    var EDGE=0.04,TIGHT=0.85,r=rnd(),value;
    if(r<EDGE)value=1;
    else{var raw=(1-EDGE)/Math.max(1e-9,1-r);value=1+(raw-1)*TIGHT;}
    value=Math.max(1.01,Math.min(value,1000));
    if(value<2){lowStreak++;if(lowStreak>8){value=2+rnd()*1.5;lowStreak=0;}}else lowStreak=0;
    return Math.floor(value*100)/100;
  }
  var _newRound=newRound;
  newRound=function(){
    _newRound();
    if(window.__serverCrash){S.crash=window.__serverCrash;window.__serverCrash=null;}
    else S.crash=genCrashPoint();
  };
  function connectSignals(){
    if(typeof io==='undefined')return;
    try{
      if(socket){socket.disconnect();socket=null;}
      socket=io(SIGNAL_HOST,{transports:['websocket','polling'],reconnection:true});
      socket.on('crash',function(data){var v=Number(data&&(data.crash||data.multiplier||data.point)||0);if(v>=1)window.__serverCrash=v;});
      socket.on('round',function(data){var v=Number(data&&(data.crash||data.multiplier)||0);if(v>=1)window.__serverCrash=v;});
    }catch(e){}
  }

  /* ===== Music ===== */
  window.__scAnimOn=true;window.__scSoundOn=true;var musicOn=true;
  var bgMusic=null;
  try{bgMusic=new Audio('https://res.cloudinary.com/qegjv5mo/video/upload/f_mp3/Aviator_bg_music.mp3');bgMusic.loop=true;bgMusic.volume=0.45;}catch(e){}
  function clearMediaSession(){
    try{if('mediaSession' in navigator){navigator.mediaSession.metadata=null;navigator.mediaSession.playbackState='none';

  function restartMusicForRound(){if(!musicOn||!bgMusic){clearMediaSession();return;}try{bgMusic.pause();bgMusic.currentTime=0;var p=bgMusic.play();clearMediaSession();if(p&&p.catch)p.catch(function(){});}catch(e){}}
  function setMusic(on){musicOn=!!on;if(!musicOn){try{bgMusic&&bgMusic.pause();}catch(e){}clearMediaSession();}else restartMusicForRound();}

  var _tick=tick;

    var prev=S.phase;_tick();

  function startApp(){
    if(!loadSession()){var g=document.getElementById('loginGate');if(g)g.classList.remove('hidden');return;}
    var g=document.getElementById('loginGate');if(g)g.classList.add('hidden');

        document.querySelectorAll('[data-tog="anim"]').forEach(function(el){el.onclick=function(){window.__scAnimOn=!window.__scAnimOn;var t=el.querySelector('.sc-tog,.tg');if(t)t.classList.toggle('on',window.__scAnimOn);};});
      }catch(e){}

  }

  // History chat icon → shareWin

})();
