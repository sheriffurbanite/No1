  function planeImg(t,sp){
    if(PL.ok!==3)return;
    var PW=150,PH=PW*PL.h/PL.w,ax=PL.ax*PW,ay=PL.ay*PH,hx=PL.hx*PW,hy=PL.hy*PH;
    cx.drawImage(IB,-ax,-ay,PW,PH);

  }

  function draw(t){
    var now=Date.now(),dt=S._lt?Math.min(50,t-S._lt):16;S._lt=t;if(S.anim)S.rot=(S.rot||0)+dt*0.00003;

    cx.restore();

      cx.fillStyle='#1c1d20';cx.fillRect(W/2-110,292,220,8);cx.fillStyle='#e8083e';cx.fillRect(W/2-110,292,220*(1-p),8);return;

    else if(pp){TM.pp=+pp.dataset.pp;renderTM()}
    else if(t.closest('#tpl'))sheet('howt');
    else if(t.closest('#trules'))sheet('dr');
  };
  SH.howt=['How to play','1. Tap Join, then raise your bet to at least '+fmt(RULES.min)+' KES (the MIN. BET tag turns LIVE).<br>2. Place bets and cash out before the plane flies away.<br>3. Your points are the highest single multiplier you cash out at: 1.00x = 1 point.<br>4. The player with the highest multiplier when the tournament ends wins the top prize.'];
  SH.dr=['Detailed rules','Bets under '+fmt(RULES.min)+' KES pause your progress. Only bets placed after joining count. Ties are ranked by who reached the score first. Shika Chapaa tournament rules apply.'];
  setInterval(function(){if(!TM.open||TM.view!=='main')return;var c=cd();for(var i=1;i<4;i++){var e=$('c'+i);if(e)e.textContent=c[i-1]}},1000);
  setInterval(function(){if(TM.open&&TM.view==='main'){TM.pp=(TM.pp+1)%RULES.prizes.length}},4000);
  buildCards();hist();
  (function(){var u=loadParentUser();setBal(u?u.balance:1000);var dem=document.querySelector('.bal .demo');if(dem){if(u){dem.style.display='none';dem.textContent=''}else{dem.style.display='';dem.textContent='DEMO'}}buildMenu()})();
  setInterval(function(){var u=loadParentUser();if(!u)return;var busy=CD.some(function(c){return c.st==='placed'||c.st==='live'});if(!busy&&Math.abs(u.balance-BAL)>0.001)setBal(u.balance)},2000);
  window.addEventListener('storage',function(e){if(e.key==='shikachapaa_user'||e.key==='shikachapaa_accounts'){var u=loadParentUser();var dem=document.querySelector('.bal .demo');if(u){var busy=CD.some(function(c){return c.st==='placed'||c.st==='live'});if(!busy)setBal(u.balance);var mph=$('mph');if(mph)mph.textContent=maskPhone(u.phone);if(dem){dem.style.display='none';dem.textContent=''}}else{if(dem){dem.style.display='';dem.textContent='DEMO'}}}});
  if(window.AviatorSound)AviatorSound.start();newRound();tick();setInterval(tick,100);requestAnimationFrame(draw);
})();
</script>
<script>
(function(){
  var SPLASH_MS=5000, CONNECTION_MS=2000, LOGO_LETTER='S';
  var c=document.getElementById('spribeLogo');
  if(c){
    var x=c.getContext('2d'),N=26,S=c.width,s=S/N;
    var o=document.createElement('canvas');o.width=o.height=S;
    var g=o.getContext('2d');
    g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
    g.font='900 '+(S*.95)+'px "Arial Black",Arial,sans-serif';
    g.fillText(LOGO_LETTER,S/2,S/2+S*.04);
    var px=g.getImageData(0,0,S,S).data;
    x.fillStyle='#fff';
    for(var i=0;i<N;i++)for(var j=0;j<N;j++){
      var d=Math.hypot(i+.5-N/2,j+.5-N/2)/(N/2);
      if(d>1)continue;
      var cov=0,n=0,a,b;
      for(a=0;a<s;a+=2)for(b=0;b<s;b+=2){cov+=px[(((j*s+b)|0)*S+((i*s+a)|0))*4+3];n++}
      cov/=n*255;
      var base=(0.16+(1-d)*.2)*(1-Math.pow(d,3));
      var r=s*.5*Math.min(1,base+cov*.95);
      if(r<.6)continue;
      x.beginPath();x.arc((i+.5)*s,(j+.5)*s,r,0,7);x.fill();
    }
  }
  function show(id){
    document.querySelectorAll('#boot .screen').forEach(function(e){e.classList.toggle('on',e.id===id)});
  }
  function launchGame(){
    var boot=document.getElementById('boot');
    var app=document.getElementById('app');
    if(app)app.classList.add('ready');
    if(boot){
      boot.classList.add('hide');
      setTimeout(function(){if(boot.parentNode)boot.parentNode.removeChild(boot)},450);
    }
  }
  setTimeout(function(){show('conn')},SPLASH_MS);
  setTimeout(launchGame,SPLASH_MS+CONNECTION_MS);
})();
</script>
