<script>
/* Aviator sound system (round-synced) - same rules as before:
   - the background music loops continuously (it keeps playing through the crash and the gap between rounds)
   - the crash ("flew away") sound plays on top of the music, and fades out when the next round starts
   - silent until the splash/connection screens finish (enable) and the player has tapped once (unlock)
   - silent while the tab/app is in the background
   NO BROWSER/PHONE MEDIA NOTIFICATION: everything plays through Web Audio only (no <audio>/<video> element),
   so Android/iOS never show the "now playing" music notification or lock-screen player.
   PHONES: the music is never fully downloaded/decoded (that crashed phones): only the first part of the file is
   read and decoded at a lower sample rate. The treble cut below removes everything above 7 kHz anyway, so the
   lower rate is not audible. */
(function (global) {
  'use strict';
  var MUSIC_URL = 'https://res.cloudinary.com/qegjv5mo/video/upload/f_mp3/Aviator_-_Music_1080p.mp3';
  var LOSS_MP3  = 'https://res.cloudinary.com/qegjv5mo/video/upload/f_mp3/VID-20261006-WA0001.mp3';
  var PHONE = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || '') || ((navigator.maxTouchPoints || 0) > 1 && Math.min(screen.width || 0, screen.height || 0) < 900);
  var MUSIC_MAX_BYTES = PHONE ? 1800000 : 4000000;   /* how much of the music file is used (~2 min / ~4 min of a 128 kbps mp3) */
  var LOSS_MAX_BYTES  = 1500000;
  var RATE = 22050;                                  /* decode rate: low memory, still above the 7 kHz treble cut */
  var ctx = null, master = null, sfxGain = null;
  var buffer = null, loading = null, lossBuf = null, lossLoading = null;
  var source = null, srcGain = null, lossSrc = null, lossG = null;
  var soundOn = true, musicOn = true;
  var inRound = true;               /* music plays continuously - it does not stop when a round ends */
  var allowed = false;              /* audio stays silent until the splash + connection screens are finished */
  var pageHidden = !!document.hidden;
  var unlocked = false;

  /* ---- Softer tone: gentle treble cut so nothing sounds shrill / high-pitched ---- */
  var TREBLE_CUT_DB = 10;
  function tone(c) {
    if (c._tone) return c._tone;
    var hs = c.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 2500; hs.gain.value = -TREBLE_CUT_DB;
    var lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000; lp.Q.value = 0.5;
    hs.connect(lp); lp.connect(c.destination);
    c._tone = hs; return hs;
  }
  function getCtx() {
    if (ctx) return ctx;
    var AC = global.AudioContext || global.webkitAudioContext;
    if (!AC) return null;
    try { ctx = new AC({ sampleRate: RATE, latencyHint: 'playback' }); } catch (e) { try { ctx = new AC(); } catch (e2) { ctx = null; } }
    if (!ctx) return null;
    master = ctx.createGain(); master.gain.value = musicOn ? 1 : 0; master.connect(tone(ctx));
    sfxGain = ctx.createGain(); sfxGain.gain.value = 1; sfxGain.connect(tone(ctx));
    return ctx;
  }
  function resumeCtx() {
    var c = getCtx();
    if (c && c.state === 'suspended') { try { return c.resume().catch(function () {}); } catch (e) {} }
    return Promise.resolve();

  /* read at most `max` bytes of a file (stops the download there) -> {ab, cut} */
  function fetchPart(url, max) {
    return fetch(url, { mode: 'cors' }).then(function (r) {
      if (!r.ok) throw new Error('audio not found');
      if (!r.body || !r.body.getReader) return r.arrayBuffer().then(function (ab) { return { ab: ab.byteLength > max ? ab.slice(0, max) : ab, cut: ab.byteLength > max }; });
      var rd = r.body.getReader(), parts = [], n = 0;

        return rd.read().then(function (x) {
          if (x.done) return false;

    return new Promise(function (res, rej) { try { var p = c.decodeAudioData(ab, res, rej); if (p && p.catch) p.catch(rej); } catch (e) { rej(e); } });
  }
  /* soft fade at both ends of a cut-off music buffer so the loop point has no click */
  function smoothLoop(b) {
    var f = Math.min(b.length >> 2, Math.round(b.sampleRate * 0.04));
    for (var ch = 0; ch < b.numberOfChannels; ch++) {
      var d = b.getChannelData(ch), L = d.length;
      for (var i = 0; i < f; i++) { var k = i / f; d[i] *= k; d[L - 1 - i] *= k; }
    }

  }
  function loadBuffer() {
    if (buffer) return Promise.resolve(buffer);
    if (loading) return loading;
    var c = getCtx();

      .then(function (r) { return decode(c, r.ab).then(function (b) { return r.cut ? smoothLoop(b) : b; }); })
      .then(function (b) { buffer = b; return b; })

  }
  function loadLoss() {

      .then(function (r) { return decode(c, r.ab); })

  function stopLoss(fadeMs) {

    lossSrc = s; lossG = g;
    s.start(0);
  }

  function unlock() {
    if (unlocked) return;

    resumeCtx();
    loadLoss().catch(function () {});

    ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) { document.removeEventListener(ev, unlock, true); });
  }

  }

  }

    start: function () { loadBuffer().catch(function () {}); loadLoss().catch(function () {}); },
    restartMusicForRound: function () {

      if (!allowed || pageHidden || !unlocked) return;
      resumeCtx().then(function () {
        if (isPlaying()) return;                       /* music is already going - let it keep playing */
        if (buffer) startFromBeginning();
        else loadBuffer().then(startFromBeginning).catch(function () {});
      });
    },
    crash: function () {

  function planeImg(t,sp){
    if(PL.ok!==3)return;
    var PW=150,PH=PW*PL.h/PL.w,ax=PL.ax*PW,ay=PL.ay*PH,hx=PL.hx*PW,hy=PL.hy*PH;
    cx.drawImage(IB,-ax,-ay,PW,PH);
    cx.save();cx.translate(hx-ax,hy-ay);
    if(S.anim){cx.fillStyle='rgba(255,5,50,.17)';cx.beginPath();cx.ellipse(0,0,9,PH*.5,0,0,7);cx.fill()}
    cx.scale(1,S.anim?Math.max(.22,Math.abs(Math.cos(t*sp))):1);cx.drawImage(IP,-hx,-hy,PW,PH);cx.restore();
  }

  function span(){var n=new Date(),s=new Date(n),e=new Date(n);s.setHours(RULES.startH,0,0,0);e.setHours(RULES.endH,0,0,0);if(n>=e){s.setDate(s.getDate()+1);e.setDate(e.getDate()+1)}return{s:s,e:e}}
  function dstr(d){return d2(d.getHours())+':'+d2(d.getMinutes())+', '+d2(d.getDate())+'.'+d2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)}
  function cd(){var ms=Math.max(0,span().e-Date.now()),t=Math.floor(ms/1000);return[Math.floor(t/3600),Math.floor(t%3600/60),t%60].map(d2)}
  var PLAY='<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#2fb30f" stroke-width="2"/><path d="M10 8l6 4-6 4z" fill="#2fb30f"/></svg>',
    WARN='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff5a52" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 16.5v.01"/></svg>',
    USR='<svg width="22" height="22" viewBox="0 0 24 24" fill="#e8e8ea"><circle cx="12" cy="8" r="4.5"/><path d="M3 21c1-5 5-7 9-7s8 2 9 7z"/></svg>',
    CHV='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#e8e8ea" stroke-width="2.4"><path d="M5 9l7 7 7-7"/></svg>',
    CAL='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    COIN='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 6v12M15 9.5c-1-1.5-5-1.5-5 .5s5 1.5 5 3.5-4 2-5 .5"/></svg>',
    POD='<svg width="46" height="46" viewBox="0 0 48 48"><path d="M8 42V30h10v12zM18 42V20h12v22zM30 42V28h10v14z" fill="#d9d9dc"/><path d="M24 4l2.2 4.5 5 .7-3.6 3.5.9 5-4.5-2.4-4.5 2.4.9-5-3.6-3.5 5-.7z" fill="#f2b21f"/></svg>';
  function laurel(){var l='';for(var i=0;i<9;i++){var t=i/8,x=44-30*Math.sin(t*2.6),y=88-80*t;l+='<ellipse cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" rx="6" ry="12" transform="rotate('+(-35+t*75).toFixed(0)+' '+x.toFixed(1)+' '+y.toFixed(1)+')" fill="#e8bd3c"/>'}return '<svg viewBox="0 0 60 96" width="60" height="96">'+l+'</svg>'}
  function prizeHTML(){var p=RULES.prizes[TM.pp];
    return '<div class="plb">Prizes</div><div class="pz"><div class="lau">'+laurel()+'</div><div class="pc"><div class="pam">&#128181; '+fmt(p.a)+' KES</div><div class="ppl"><i>'+p.p+'</i>Place</div></div><div class="lau fl">'+laurel()+'</div></div><div class="dots">'+RULES.prizes.map(function(_,i){return '<b data-pp="'+i+'" class="'+(i===TM.pp?'on':'')+'"></b>'}).join('')+'</div>'}
  function tmMain(){
    stats();var w=span(),j=TM.joined,mt=meets(),c=cd(),h='';
    h+='<div class="tmt">'+((j&&!mt)?'<span class="chip red">'+WARN+'MIN. BET</span>':'<span class="chip">'+PLAY+'LIVE</span>')+'<span class="chip">'+USR+fnum(BOT.n+(j?1:0))+'</span><i class="tmx" id="tmx">&#10005;</i></div>';
    h+='<div class="tlogo"><span>TOURNAMENTS</span></div><h2 class="ttl">KES 400,000 Daily Crown</h2>';
    if(!j)h+='<button id="tjn">Join</button>';
    h+='<div class="tend">End: '+w.e.getDate()+' '+MON[w.e.getMonth()]+' '+w.e.getFullYear()+' &bull; '+d2(RULES.endH)+':00</div>';
    if(!j||mt)h+='<div class="cds"><b id="c1">'+c[0]+'</b><i>:</i><b id="c2">'+c[1]+'</b><i>:</i><b id="c3">'+c[2]+'</b></div>';
    if(j&&!mt)h+='<div class="twarn">Your bet is below the '+fmt(RULES.min)+' KES minimum for the Tournament! Progress is paused.</div>';
    h+='<div class="tcard"><div class="trow"><span>Tasks</span><a id="tlb">Leaderboard</a></div><div class="tdes"><i>&#129321;</i><span>The winner is the player who catches the single highest multiplier in the tournament. 1.00x = 1 Point.</span></div>';
    if(j)h+='<div class="tstat"><div><i style="font-style:normal;font-size:40px">&#128296;</i><span>Points Scored<b>'+fmt(TM.best)+'</b></span></div><div>'+POD+'<span>Position<b>'+fnum(TM.rank)+'</b></span></div></div>';
    h+=prizeHTML()+'<div class="tdiv shx" id="tpl">How to play?</div></div>';
    h+='<div class="oi"><div class="h" id="tinfo"><span>Other Information</span><span style="transform:rotate('+(TM.info?0:180)+'deg);display:flex">'+CHV+'</span></div>';
    if(TM.info)h+='<div class="r2">'+CAL+'<span>Start:</span><b>'+dstr(w.s)+'</b></div><div class="r2"><i style="font-style:normal;font-size:24px">&#127937;</i><span>End:</span><b>'+dstr(w.e)+'</b></div><div class="r2">'+COIN+'<span>Min. Bet:</span><b>'+fmt(RULES.min)+' KES</b></div>';
    h+='</div><div class="tfoot">By joining the event, you are agreeing to the:<a class="shx" id="trules">Detailed rules</a></div>';
    return h;
  }
  function tmLB(){
    stats();var top=topList(50),h='<div class="lbh"><i id="lbb">&#8249;</i>Leaderboard<span>'+fnum(BOT.n+(TM.joined?1:0))+' players</span></div><div class="lbc"><span>#</span><span>Player</span><em>Points</em><u>Prize KES</u></div>';
    var rows=top.map(function(i){return{n:'2***'+BOT.d[i],v:BOT.b[i],me:0}});
    if(TM.joined&&TM.best>0)rows.push({n:'You',v:TM.best,me:1});
    rows.sort(function(a,b){return b.v-a.v});rows=rows.slice(0,50);
    var inTop=rows.some(function(r){return r.me});
    h+=rows.map(function(r,i){var pz=prizeFor(i+1);return '<div class="lbr'+(r.me?' you':'')+'"><b>'+(i+1)+'</b><span>'+r.n+'</span><em>'+fmt(r.v)+'</em><u>'+(pz?fnum(pz):'')+'</u></div>'}).join('');
    if(TM.joined&&!inTop)h+='<div class="lbr you"><b>'+fnum(TM.rank)+'</b><span>You</span><em>'+fmt(TM.best)+'</em><u></u></div>';
    return h;
  }
  function renderTM(){var tm=$('tm'),sc=tm.scrollTop;tm.innerHTML=TM.view==='lb'?tmLB():tmMain();tm.scrollTop=sc}
  function tmOpen(v){TM.open=v;$('tb').classList.toggle('show',v);$('tm').classList.toggle('show',v);if(v){$('menu').classList.remove('show');TM.view='main';TM.sig='';TM.dirty=true;$('tm').scrollTop=0;renderTM();window.scrollTo(0,0)}}
  document.querySelector('.bn').onclick=function(){tmOpen(true)};
  $('tb').onclick=function(){tmOpen(false)};
  $('tm').onclick=function(e){
    var t=e.target,pp=t.closest('[data-pp]');
    if(t.closest('#tmx'))tmOpen(false);
    else if(t.closest('#tjn')){TM.joined=true;TM.e=span().e.getTime();TM.dirty=true;tmSave();toast('You joined the tournament',true);renderTM()}
    else if(t.closest('#tlb')){TM.view='lb';$('tm').scrollTop=0;renderTM()}
    else if(t.closest('#lbb')){TM.view='main';renderTM()}
    else if(t.closest('#tinfo')){TM.info=!TM.info;renderTM()}
    else if(pp){TM.pp=+pp.dataset.pp;renderTM()}
    else if(t.closest('#tpl'))sheet('howt');
    else if(t.closest('#trules'))sheet('dr');
  };
  SH.howt=['How to play','1. Tap Join, then raise your bet to at least '+fmt(RULES.min)+' KES (the MIN. BET tag turns LIVE).<br>2. Place bets and cash out before the plane flies away.<br>3. Your points are the highest single multiplier you cash out at: 1.00x = 1 point.<br>4. The player with the highest multiplier when the tournament ends wins the top prize.'];
  SH.dr=['Detailed rules','Bets under '+fmt(RULES.min)+' KES pause your progress. Only bets placed after joining count. Ties are ranked by who reached the score first. Shika Chapaa tournament rules apply.'];
  setInterval(function(){if(!TM.open||TM.view!=='main')return;var c=cd();for(var i=1;i<4;i++){var e=$('c'+i);if(e)e.textContent=c[i-1]}},1000);
  setInterval(function(){if(TM.open&&TM.view==='main'){TM.pp=(TM.pp+1)%RULES.prizes.length}},4000);
  buildCards();hist();
  function isAdmin(){return ACC.slice(-9)==='797124175'}
  function fbKey(){return 'av_fb_v1:'+ACC}
  function fbDay(){var n=new Date(Date.now());return n.getFullYear()+'-'+(n.getMonth()+1)+'-'+n.getDate()}
  function fbDone(){try{return localStorage.getItem(fbKey())===fbDay()}catch(e){return false}}
  function fbClaim(){
    if(!isAdmin())return;
    setBal(BAL+10000);toast('KES 10,000 Free Bets claimed',true);sheet('free');
  }
  // ---- block select / long-press menu / drag / copy outside real inputs
  function okEd(t){return t&&t.closest&&t.closest('input,textarea,.ci')}
  ['contextmenu','selectstart','dragstart','copy','cut'].forEach(function(n){document.addEventListener(n,function(e){if(!okEd(e.target))e.preventDefault()},true)});
  document.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&'acxusp'.indexOf(String(e.key).toLowerCase())>-1&&String(e.key).length===1&&!okEd(e.target))e.preventDefault()},true);
  // ---- desktop keyboard shortcuts
  function typing(t){var g=t&&t.tagName;return g==='INPUT'||g==='TEXTAREA'||(t&&t.isContentEditable)}
  document.addEventListener('keydown',function(e){
    if(!document.documentElement.classList.contains('dk')||e.ctrlKey||e.metaKey||e.altKey||!$('app').classList.contains('ready'))return;
    var t=e.target,k=e.key;if(typing(t))return;
    if(k==='Escape'){['menu','sheet','hm','hp'].forEach(function(id){$(id).classList.remove('show')});if($('chat').classList.contains('show'))chatShow(false);if(TM.open)tmOpen(false);return}
    if(k===' '||k==='1'||k==='2'||k==='c'||k==='C'||k==='m'||k==='M'){
      e.preventDefault();if(t&&t.tagName==='BUTTON')t.blur();if(e.repeat)return;
      if(k===' '||k==='1')betClick(0);
      else if(k==='2')betClick(1);
      else if(k==='c'||k==='C'){$('menu').classList.remove('show');chatShow(!$('chat').classList.contains('show'))}
      else $('mb').click();
    }
  });
  document.addEventListener('keyup',function(e){if(e.key===' '&&document.documentElement.classList.contains('dk')&&!typing(e.target))e.preventDefault()});
  tmLoad();setInterval(function(){tmExpire();tmPay()},5000);syncClock();setInterval(syncClock,300000);
  (function(){var u=loadParentUser();setBal(u?u.balance:1000);var dem=document.querySelector('.bal .demo');if(dem){if(u){dem.style.display='none';dem.textContent=''}else{dem.style.display='';dem.textContent='DEMO'}}buildMenu()})();
  setInterval(function(){var u=loadParentUser();if(!u)return;if(acctId()!==ACC)switchAcct();var busy=CD.some(function(c){return c.st==='placed'||c.st==='live'});if(!busy&&Math.abs(u.balance-BAL)>0.001)setBal(u.balance)},2000);
  window.addEventListener('storage',function(e){if(e.key==='sc_user'||e.key==='sc_accounts'||e.key==='sc_bal'){var u=loadParentUser();if(u&&acctId()!==ACC)switchAcct();var dem=document.querySelector('.bal .demo');if(u){var busy=CD.some(function(c){return c.st==='placed'||c.st==='live'});if(!busy)setBal(u.balance);var mph=$('mph');if(mph)mph.textContent=maskPhone(u.phone);if(dem){dem.style.display='none';dem.textContent=''}}else{if(dem){dem.style.display='';dem.textContent='DEMO'}}}});
  if(window.AviatorSound)AviatorSound.start();newRound();tick();setInterval(tick,100);requestAnimationFrame(draw);
})();
</script>
<script>
(function(){
  var SPLASH_MS=5000, CONNECTION_MS=2000, LOGO_LETTER='S';
  var c=document.getElementById('spribeLogo');
  if(c){
    var x=c.getContext('2d'),N=26,S=c.width,s=S/N;
    var o=document.createElement('canvas');o.width=o.height=S;
    var g=o.getContext('2d');
    g.fillStyle='#fff';g.textAlign='center';g.textBaseline='middle';
    g.font='900 '+(S*.95)+'px "Arial Black",Arial,sans-serif';
    g.fillText(LOGO_LETTER,S/2,S/2+S*.04);
    var px=g.getImageData(0,0,S,S).data;
    x.fillStyle='#fff';
    for(var i=0;i<N;i++)for(var j=0;j<N;j++){
      var d=Math.hypot(i+.5-N/2,j+.5-N/2)/(N/2);
      if(d>1)continue;
      var cov=0,n=0,a,b;
      for(a=0;a<s;a+=2)for(b=0;b<s;b+=2){cov+=px[(((j*s+b)|0)*S+((i*s+a)|0))*4+3];n++}
      cov/=n*255;
      var base=(0.16+(1-d)*.2)*(1-Math.pow(d,3));
      var r=s*.5*Math.min(1,base+cov*.95);
      if(r<.6)continue;
      x.beginPath();x.arc((i+.5)*s,(j+.5)*s,r,0,7);x.fill();
    }
  }
  function show(id){
    document.querySelectorAll('#boot .screen').forEach(function(e){e.classList.toggle('on',e.id===id)});
  }
  function launchGame(){
    var boot=document.getElementById('boot');
    var app=document.getElementById('app');
    if(app)app.classList.add('ready');
    try{sessionStorage.setItem('sc_av_booted','1')}catch(e){}
    if(window.SCT)SCT.event('game-ready','Game ready');
    try{if(window.AviatorSound&&AviatorSound.enable)AviatorSound.enable()}catch(e){}
    if(boot){
      boot.classList.add('hide');
      setTimeout(function(){if(boot.parentNode)boot.parentNode.removeChild(boot)},450);
    }
  }
  var BOOTED=false;
  if(BOOTED){launchGame()}
  else{
  if(window.SCT)SCT.event('splash','Splash screen');
  setTimeout(function(){if(window.SCT)SCT.event('connecting','Connecting screen');show('conn')},SPLASH_MS);
  setTimeout(launchGame,SPLASH_MS+CONNECTION_MS);
  }
})();
</script>
