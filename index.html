<title>Shika Chapaa – Virtual Sports &amp; Aviator</title>
<meta name="theme-color" content="#231659"><meta name="description" content="Shika Chapaa: virtual football, Aviator and fast M-Pesa deposits. 18+ only. Play responsibly.">
<link rel="icon" type="image/png" href="https://res.cloudinary.com/qegjv5mo/image/upload/v1793090324/file_00000000691081f58998fa31e2a062e8.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d1c;--s1:#121832;--s2:#1a2245;--ln:#2a3360;--tx:#eef1fb;--mu:#8f99bd;--gold:#f0b94d;--mint:#35e0b2;--red:#ff6a7a;--ink:#2a1d00;--in:#0d1229;box-sizing:border-box}
:root[data-th=light]{--bg:#eef0f8;--s1:#fff;--s2:#e7eaf6;--ln:#d3d8ec;--tx:#121832;--mu:#5d6788;--in:#f4f6fc;--mint:#0d9b76;--red:#d6334a}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "DM Sans",system-ui,sans-serif;padding-bottom:78px}
h1,h2,h3,.logo b{font-family:"Bricolage Grotesque",Georgia,serif;margin:0}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#231659,#4b1d92 60%,#6b21a8);color:#fff;box-shadow:0 6px 24px #0006}
.bar{max-width:1180px;margin:auto;display:flex;align-items:center;gap:8px;padding:9px 12px}
.sp{margin-left:auto}.ib{padding:6px;border-radius:8px}.ib:hover{background:#fff2}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff}.logo b{font-size:15px;letter-spacing:.4px;line-height:1}.logo small{display:block;color:#ffd98a;font:500 9px "DM Sans";letter-spacing:2px;margin-top:3px}
.btn{border-radius:10px;padding:10px 16px;font-weight:700;background:linear-gradient(135deg,var(--gold),#ffd98a);color:var(--ink);transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.07);transform:translateY(-1px)}.btn.sm{padding:7px 12px;font-size:13px}.btn.ghost{background:transparent;color:inherit;border:1px solid var(--ln)}.btn.grn{background:linear-gradient(135deg,#17a34a,#35e0b2);color:#06281b}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}.btn.w{width:100%}
header .btn.ghost{border-color:#fff5}
.acc{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;background:#0003;border-radius:99px;padding:6px 12px}
nav{max-width:1180px;margin:auto;display:flex;overflow-x:auto;scrollbar-width:none;background:var(--s1);color:var(--mu)}
nav button{flex:1;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;font-size:12px;font-weight:700;border-bottom:2px solid transparent}
nav button.on{color:var(--tx);border-color:var(--gold)}nav .ic{width:18px;height:18px}
.crumb{max-width:1180px;margin:10px auto 0;padding:0 12px;display:flex;align-items:center;gap:8px;color:var(--mu)}
.crumb>div{display:flex;align-items:center;gap:8px;background:var(--s2);border-radius:12px;padding:6px;width:100%}.crumb .back{background:var(--gold);color:var(--ink);border-radius:8px;padding:6px}.crumb b{color:var(--tx)}.crumb .ic{width:16px;height:16px}
main{max-width:1180px;margin:auto;padding:12px;display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){main{grid-template-columns:1fr 340px}body{padding-bottom:0}#bn{display:none!important}}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:16px}
.gs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.gt{flex:0 0 112px;height:78px;border-radius:14px;color:#fff;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:10px;font-weight:700;font-size:13px;position:relative;overflow:hidden;box-shadow:0 8px 18px #0004}
.gt .ic{width:28px;height:28px;stroke-width:1.6}.gt:after{content:"";position:absolute;right:-18px;top:-18px;width:60px;height:60px;border-radius:50%;background:#fff2}
.ls{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px;padding:2px}
.lc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--mu);min-width:52px}.lc i{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 13px "Bricolage Grotesque";font-style:normal;color:#fff}.lc.on{color:var(--tx)}.lc.on i{outline:2px solid var(--gold);outline-offset:2px}
.tabs2{display:flex;border-bottom:1px solid var(--ln);margin-bottom:10px}.tabs2 button{flex:1;padding:11px;font-weight:700;color:var(--mu);display:flex;justify-content:center;gap:6px;align-items:center;border-bottom:2px solid transparent}.tabs2 button.on{color:var(--tx);border-color:var(--gold)}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.hm{flex:0 0 min(86%,330px);scroll-snap-align:start;background:linear-gradient(160deg,var(--s2),var(--s1));border:1px solid var(--ln);border-radius:16px;padding:12px}
.hm small{display:block;color:var(--mu);text-align:center;font-size:11px}.hm .vs{display:flex;justify-content:center;gap:8px;font-weight:700;margin:6px 0 10px;text-align:center}
.dots{display:flex;justify-content:center;gap:6px;margin:10px 0}.dots i{width:6px;height:6px;border-radius:9px;background:var(--ln)}.dots i.on{width:20px;background:var(--gold)}
.bo{flex:0 0 min(86%,320px);scroll-snap-align:start;background:linear-gradient(150deg,#3a2d0c,#1b1630);border:1px solid #6b5316;border-radius:16px;padding:14px;color:#eef1fb}
.bo .p{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-bottom:1px dashed #fff2}.bo h3{font-size:22px;color:var(--gold);margin:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:10px 0}
.chip{border:1px solid var(--ln);background:var(--s1);border-radius:9px;padding:8px 13px;white-space:nowrap;color:var(--mu);font-weight:500}.chip.on{background:#4b1d92;border-color:#4b1d92;color:#fff;font-weight:700}
.lg{background:var(--s2);color:var(--mu);font-size:12px;padding:8px 12px;border-radius:10px 10px 0 0;margin-top:10px}
.match{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--s1);border:1px solid var(--ln);border-top:0;padding:10px}
.match:last-child{border-radius:0 0 12px 12px}.tm{font-weight:700;font-size:14px}.when{color:var(--mu);font-size:12px;margin-top:4px}.when b{color:var(--red)}
.odds{display:flex;gap:6px}.odds.wrap{flex-wrap:wrap}
.od{min-width:60px;border:1px solid var(--ln);background:var(--in);border-radius:10px;padding:7px 6px;text-align:center;transition:background .2s,border-color .2s}
.od small{display:block;color:var(--mu);font-size:10px}.od strong{font-size:15px}.od:hover{border-color:var(--gold)}.od.sel{background:var(--gold);border-color:var(--gold);color:var(--ink)}.od.sel small{color:#5a4310}
.od.up strong{color:var(--mint)}.od.dn strong{color:var(--red)}.od.sel strong{color:var(--ink)}
.more{display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--mu);padding:4px}.more b{color:var(--tx);font-size:13px}
.slip{background:var(--s1);border:1px solid var(--ln);border-radius:18px;padding:14px;position:sticky;top:150px}
.sh{display:none;justify-content:space-between;align-items:center;margin-bottom:10px;font:700 18px "Bricolage Grotesque"}
.stabs{display:flex;gap:8px;margin-bottom:10px}.stabs span{flex:1;text-align:center;padding:8px;border-radius:9px;font-weight:700;font-size:13px;color:var(--mu)}.stabs .on{background:var(--gold);color:var(--ink)}
.leg{background:var(--in);border-radius:10px;padding:9px 10px;margin-bottom:8px;display:flex;justify-content:space-between;gap:8px;font-size:13px}.leg span{color:var(--mu);font-size:12px;display:block}
.row{display:flex;justify-content:space-between;margin:6px 0;color:var(--mu)}.row b{color:var(--tx)}
input[type=text],input[type=password],input:not([type]),input[inputmode],textarea{width:100%;background:var(--in);border:1px solid var(--ln);color:var(--tx);border-radius:11px;padding:12px;font:inherit}
textarea{min-height:90px}.q{display:flex;gap:6px;margin:8px 0}.q button{flex:1;padding:9px 0;border-radius:9px;border:1px solid var(--ln);font-weight:500}
.empty{text-align:center;padding:26px 10px;color:var(--mu)}.empty h3{color:var(--tx);margin-bottom:6px}
.err{color:var(--red);font-size:12px;min-height:16px;margin:4px 0}
@media(max-width:959px){aside{position:fixed;inset:auto 0 0 0;z-index:40;transform:translateY(105%);transition:transform .3s;max-height:84vh;overflow:auto}aside.open{transform:none}.slip{position:static;border-radius:20px 20px 0 0}.sh{display:flex}}
#bn{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--s1);border-top:1px solid var(--ln);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
#bn button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mu);position:relative}#bn .on{color:var(--tx)}#bn .on .ic{color:var(--gold)}
#bn em{position:absolute;top:-4px;right:calc(50% - 22px);background:var(--gold);color:var(--ink);border-radius:99px;font:800 10px "DM Sans";font-style:normal;padding:1px 6px}
.bet{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:13px;margin-bottom:10px}.bet .h{display:flex;justify-content:space-between;font-weight:700}

  function build(){

   - visit  : a screen/popup opened  -> the address bar changes, the page title changes, a "visit" is logged
   - click  : any button/link/input tapped -> logged as /en-ke/<screen>#<element-tag> and the element gets data-track="<element-tag>"
   - event  : a business action (bet placed, deposit, login, support message ...) -> logged as /en-ke/<area>/<action>
   Logs go to: localStorage "sc_visits" (last 300), window.dataLayer / gtag / fbq when present,

const imgArt=k=>()=>`<img class="art" src="${GIMG[k]}" alt="" style="object-fit:cover">`;
/* games that have a cover but no game file behind them: tapping says the game is not available */
const EXTRA=[["jetx","JetX"],["aviatrix","Aviatrix"],["highflyer","High Flyer"],["astronaut","Astronaut Rivals"],["maestro","Maestro"]];
const naTile=x=>`<button class="gc" data-na="${x[1]}" aria-label="${x[1]}">${imgArt(x[0])()}</button>`;
const TILES=()=>gcard('data-aviator',"Aviator","Crash game",AVART)+EXTRA.map(naTile).join("")+gcard('data-go="casino" data-g="dice"',"Dice","Under or over",A.dice)+gcard('data-go="jackpot"',"Jackpot","Win 8,000",A.jack)+gcard('data-a="boost"',"Boosted triple","+10% odds",A.boost);
const PROMOS=[["aviator","Shika Chapaa Aviator daily tournament",'data-aviator'],["refer","Refer and earn",'data-go="account"'],["jackpot","Casino jackpot",'data-go="casino"'],["spin","Earn a spin for every 50 KES staked",'data-go="casino"'],["rescue","Up to 5% daily rescue bonus",'data-cm="dep"']];
const promoImg=p=>`<img src="${PROMO_IMG[p[0]]}" alt="${p[1]}" width="840" height="448" draggable="false">`;
const banners=()=>`<div class="ban" id="ban">${PROMOS.map(p=>`<button class="pb" ${p[2]} aria-label="${p[1]}">${promoImg(p)}</button>`).join("")}</div><div class="dots" id="bdots">${PROMOS.map((_,i)=>`<i class="${i?"":"on"}"></i>`).join("")}</div>`;
